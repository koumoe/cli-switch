[package]
name = "cliswitch"
version = "0.64.6"
edition = "2024"

[features]
default = ["desktop"]
embed-ui = ["dep:rust-embed"]
desktop = ["dep:tao", "dep:wry", "dep:muda", "dep:tray-icon", "dep:rfd", "embed-ui"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8.7"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
futures-util = "0.3"
http = "1"
mime_guess = "2"
qrcode = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "brotli", "deflate", "multipart", "blocking", "cookies"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = { version = "8", optional = true }
rfd = { version = "0.17", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.23"
tao = { version = "0.34", optional = true }
thiserror = "2"
time = { version = "0.3", features = ["local-offset"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
wry = { version = "0.53", optional = true }
muda = { version = "0.17", optional = true }
tray-icon = { version = "0.21", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
auto-launch = "0.5.0"
notify-rust = "4.12.0"
semver = "1"
flate2 = "1"
hex = "0.4"
sha2 = "0.10"
tar = "0.4"
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }
xz2 = "0.1"
whatsapp-rust = { version = "0.5.0", default-features = false, features = ["sqlite-storage", "tokio-runtime"] }
whatsapp-rust-tokio-transport = "0.5.0"
wacore = { version = "0.5.0", default-features = false }
wacore-binary = { version = "0.5.0", default-features = false }

[patch.crates-io]
whatsapp-rust = { path = "vendor/whatsapp-rust" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
