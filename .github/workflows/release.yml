name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "25.2.1"
  RUST_VERSION: "1.92.0"

jobs:
  # =============================================================================
  # 0. 检查是否跳过（避免循环触发）
  # =============================================================================
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - name: Check commit message
        id: check
        run: |
          msg="$(python3 - <<'PY'
          import json, os
          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as f:
              event = json.load(f)
          print((event.get("head_commit") or {}).get("message") or "")
          PY
          )"
          if [[ "$msg" == chore\(release\):* ]]; then
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping release workflow for release commit"
          else
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ Proceeding with release workflow"
          fi

  # =============================================================================
  # 1. 分析 commits，确定是否需要发布
  # =============================================================================
  analyze:
    name: Analyze
    needs: check
    if: needs.check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.analyze.outputs.should_release }}
      version: ${{ steps.analyze.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Analyze commits
        id: analyze
        run: |
          node scripts/analyze-next-version.mjs

  # =============================================================================
  # 2. 准备发布：更新版本文件 + commit + push
  # =============================================================================
  prepare:
    name: Prepare
    needs: analyze
    if: needs.analyze.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      ref: ${{ steps.prepare.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure git
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update version files
        id: prepare
        env:
          VERSION: ${{ needs.analyze.outputs.version }}
        run: |
          echo "📦 Updating to version ${VERSION}"

          # 更新版本文件
          node scripts/bump-version.mjs "${VERSION}"

          # 生成 CHANGELOG（只追加新条目）
          npm install -g conventional-changelog-cli
          conventional-changelog -p conventionalcommits -k ui/package.json -i docs/changelog/en.md -s

          # 同步中文版本（缺失版本会从英文复制并翻译标题）
          node scripts/changelog-i18n.mjs sync docs/changelog/en.md docs/changelog/cn.md
          # 校验中英文版本块一致，避免发布空/不完整 cn.md
          node scripts/changelog-i18n.mjs check docs/changelog/en.md docs/changelog/cn.md

          # 提交变更
          git add Cargo.toml Cargo.lock ui/package.json ui/package-lock.json docs/changelog/en.md docs/changelog/cn.md
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git push

          {
            echo "version=${VERSION}"
            echo "tag=v${VERSION}"
            echo "ref=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "✅ Version files updated and pushed"

  # =============================================================================
  # 3. 并行构建各平台
  # =============================================================================
  build_ui:
    name: Build UI (artifact)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Upload UI dist
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

  build_linux_x64:
    name: Linux x64
    needs: [prepare, build_ui]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download UI dist
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          pkg="cliswitch-${VERSION}-linux-x64"
          mkdir -p "dist/${pkg}"
          cp target/release/cliswitch "dist/${pkg}/"
          cp README.md LICENSE "dist/${pkg}/"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
          sha256sum "dist/${pkg}.tar.gz" | cut -d' ' -f1 > "dist/${pkg}.tar.gz.sha256"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: build-linux-x64
          path: |
            dist/*.tar.gz*
            dist/*.zip*
          if-no-files-found: error

  build_linux_arm64:
    name: Linux ARM64
    needs: [prepare, build_ui]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download UI dist
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          pkg="cliswitch-${VERSION}-linux-arm64"
          mkdir -p "dist/${pkg}"
          cp target/release/cliswitch "dist/${pkg}/"
          cp README.md LICENSE "dist/${pkg}/"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
          sha256sum "dist/${pkg}.tar.gz" | cut -d' ' -f1 > "dist/${pkg}.tar.gz.sha256"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: build-linux-arm64
          path: |
            dist/*.tar.gz*
            dist/*.zip*
          if-no-files-found: error

  build_macos_x64:
    name: macOS x64
    needs: [prepare, build_ui]
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download UI dist
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          pkg="CliSwitch-${VERSION}-macos-x64"
          SKIP_UI=1 bash scripts/bundle-macos-app.sh
          mkdir -p "dist/${pkg}"
          cp -R dist/macos/CliSwitch.app "dist/${pkg}/"
          cp README.md LICENSE "dist/${pkg}/"
          ditto -c -k --sequesterRsrc --keepParent "dist/${pkg}" "dist/${pkg}.zip"
          shasum -a 256 "dist/${pkg}.zip" | cut -d' ' -f1 > "dist/${pkg}.zip.sha256"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: build-macos-x64
          path: |
            dist/*.tar.gz*
            dist/*.zip*
          if-no-files-found: error

  build_macos_arm64:
    name: macOS ARM64
    needs: [prepare, build_ui]
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download UI dist
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          pkg="CliSwitch-${VERSION}-macos-arm64"
          SKIP_UI=1 bash scripts/bundle-macos-app.sh
          mkdir -p "dist/${pkg}"
          cp -R dist/macos/CliSwitch.app "dist/${pkg}/"
          cp README.md LICENSE "dist/${pkg}/"
          ditto -c -k --sequesterRsrc --keepParent "dist/${pkg}" "dist/${pkg}.zip"
          shasum -a 256 "dist/${pkg}.zip" | cut -d' ' -f1 > "dist/${pkg}.zip.sha256"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: build-macos-arm64
          path: |
            dist/*.tar.gz*
            dist/*.zip*
          if-no-files-found: error

  build_windows_x64:
    name: Windows x64
    needs: [prepare, build_ui]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download UI dist
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: pwsh
        run: |
          $pkg = "CliSwitch-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Path "dist\$pkg" -Force | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\cliswitch.exe" "dist\$pkg\CliSwitch.exe"
          Copy-Item "README.md","LICENSE" "dist\$pkg\"
          Compress-Archive -Path "dist\$pkg" -DestinationPath "dist\$pkg.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist\$pkg.zip").Hash.ToLower()
          $hash | Out-File -FilePath "dist\$pkg.zip.sha256" -Encoding utf8 -NoNewline

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: build-windows-x64
          path: |
            dist/*.tar.gz*
            dist/*.zip*
          if-no-files-found: error

  build_windows_arm64:
    name: Windows ARM64
    needs: [prepare, build_ui]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download UI dist
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: pwsh
        run: |
          $pkg = "CliSwitch-$env:VERSION-windows-arm64"
          New-Item -ItemType Directory -Path "dist\$pkg" -Force | Out-Null
          Copy-Item "target\aarch64-pc-windows-msvc\release\cliswitch.exe" "dist\$pkg\CliSwitch.exe"
          Copy-Item "README.md","LICENSE" "dist\$pkg\"
          Compress-Archive -Path "dist\$pkg" -DestinationPath "dist\$pkg.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist\$pkg.zip").Hash.ToLower()
          $hash | Out-File -FilePath "dist\$pkg.zip.sha256" -Encoding utf8 -NoNewline

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: build-windows-arm64
          path: |
            dist/*.tar.gz*
            dist/*.zip*
          if-no-files-found: error

  # =============================================================================
  # 4. 发布：创建 tag + Release + 上传 assets（原子操作）
  # =============================================================================
  publish:
    name: Publish
    needs:
      - prepare
      - build_linux_x64
      - build_linux_arm64
      - build_macos_x64
      - build_macos_arm64
      - build_windows_x64
      - build_windows_arm64
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.build_linux_x64.result == 'success' &&
      needs.build_linux_arm64.result == 'success' &&
      needs.build_macos_x64.result == 'success' &&
      needs.build_macos_arm64.result == 'success' &&
      needs.build_windows_x64.result == 'success' &&
      needs.build_windows_arm64.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: build-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("${asset}")
          done < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets found in dist/"
            exit 1
          fi
          gh release create "${TAG}" "${assets[@]}" --title "${TAG}" --generate-notes --verify-tag
