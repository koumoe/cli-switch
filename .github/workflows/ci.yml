name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "25.2.1"
  RUST_VERSION: "1.92.0"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Lint i18n catalogs
        run: node scripts/i18n-lint.mjs

      - name: Check changelog i18n
        run: node scripts/changelog-i18n.mjs check docs/changelog/en.md docs/changelog/cn.md

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Upload UI dist
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist-pr
          path: ui/dist
          if-no-files-found: error

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Rust fmt (check)
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --no-default-features --features embed-ui --all-targets -- -D warnings

      - name: Rust test
        run: cargo test --no-default-features --features embed-ui

  desktop-smoke:
    name: Desktop Smoke (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runs_on: ubuntu-24.04
            install_linux_deps: true
            build_command: cargo build --release
            rust_cache_shared_key: ""
          - name: macOS
            runs_on: macos-14
            install_linux_deps: false
            build_command: cargo build --release
            rust_cache_shared_key: ""
          - name: Windows
            runs_on: windows-latest
            install_linux_deps: false
            build_command: cargo build --release --target x86_64-pc-windows-msvc
            rust_cache_shared_key: desktop-windows-x64-release

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download UI dist
        uses: actions/download-artifact@v8
        with:
          name: ui-dist-pr
          path: ui/dist

      - name: Install desktop dependencies (Linux)
        if: matrix.install_linux_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.rust_cache_shared_key }}

      - name: Build (release, default features)
        run: ${{ matrix.build_command }}

  ci:
    runs-on: ubuntu-latest
    needs:
      - validate
      - desktop-smoke
    if: always()
    steps:
      - name: Ensure required jobs passed
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DESKTOP_SMOKE_RESULT: ${{ needs.desktop-smoke.result }}
        run: |
          if [[ "${VALIDATE_RESULT}" != "success" ]]; then
            echo "validate failed: ${VALIDATE_RESULT}"
            exit 1
          fi
          if [[ "${DESKTOP_SMOKE_RESULT}" != "success" ]]; then
            echo "desktop-smoke failed: ${DESKTOP_SMOKE_RESULT}"
            exit 1
          fi
